apiVersion: v1
kind: ConfigMap
metadata:
  name: technozis-config
  namespace: technozis-voice-agent
data:
  APP_VERSION: "3.0.0"
  AGENT_NAME: "Velu"
  COMPANY_NAME: "Technozis"
  COMPANY_DESCRIPTION: "an enterprise AI services company based in the United Kingdom"
  # VA-D2 fix: no longer offers Tamil/Hindi — this is an English-only build
  # (see backend/voice/stt.py forcing language_code="en" and
  # config.py's own GREETING_TEMPLATE default, which this now matches).
  # The old wording was caller-facing: the deployed agent was promising a
  # language it could not actually speak.
  GREETING_TEMPLATE: "Hello! Thank you for calling {company_name}. I'm {agent_name}, your AI assistant. How can I help you today?"
  GOOGLE_CALENDAR_ID: "primary"
  GOOGLE_CALENDAR_TIMEZONE: "Asia/Kolkata"
  # Without this, the backend falls back to its code default
  # (http://localhost:3000,http://127.0.0.1:3000), which silently breaks
  # the production dashboard's credentialed API calls. Replace
  # app.yourdomain.com below with your real dashboard domain (must match
  # the app.yourdomain.com host used in k8s/05-frontend-deployment.yaml's
  # ingress).
  CORS_ALLOWED_ORIGINS: "https://app.yourdomain.com"
  # REDIS_URL is NOT set here — it must include the Redis password (see
  # k8s/03-redis.yaml's requirepass) and therefore lives in the Secret
  # (k8s/01-secret.example.yaml) instead of this plaintext ConfigMap.
  REDIS_ENABLED: "true"
  REDIS_SESSION_TTL: "3600"
  REDIS_LLM_CACHE_TTL: "3600"
  REDIS_RAG_CACHE_TTL: "86400"
  ENABLE_GUARDRAILS: "true"
  ENABLE_ROLLING_MEMORY: "true"
  ENABLE_SENTIMENT_ANALYTICS: "true"
  ENABLE_EVENT_BUS: "true"
  ROLLING_MEMORY_MAX_TURNS: "10"
  ROLLING_MEMORY_SUMMARY_MODEL: "gpt-4o-mini"
  SENTIMENT_MODEL: "gpt-4o-mini"
  ORCHESTRATOR_ROUTER_MODEL: "gpt-4o-mini"
  STICKY_ROUTE_TTL: "120"
