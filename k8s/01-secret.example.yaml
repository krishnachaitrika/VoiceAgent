# Copy this to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f k8s/secret.yaml
# Never commit the filled-in version — this template only contains keys.
apiVersion: v1
kind: Secret
metadata:
  name: technozis-secrets
  namespace: technozis-voice-agent
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-..."
  SARVAM_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  ELEVENLABS_VOICE_ID: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""
  DATABASE_URL: "postgresql+asyncpg://postgres:[password]@db.[ref].supabase.co:5432/postgres"
  GOOGLE_CREDENTIALS_JSON: "credentials.json"
  # Required — the API refuses every /api/dashboard, /api/settings,
  # /api/documents and /api/analytics request if these are blank.
  # Generate with e.g. `openssl rand -hex 32`. The frontend deployment
  # (05-frontend-deployment.yaml) reads DASHBOARD_ADMIN_KEY from this same
  # secret so the dashboard can still reach the API.
  DASHBOARD_API_KEY: ""
  DASHBOARD_ADMIN_KEY: ""
  # Redis password — must match verbatim what k8s/03-redis.yaml's
  # StatefulSet passes to `--requirepass` (it reads this same secret key
  # directly, so setting it once here is enough).
  REDIS_PASSWORD: ""
  # Full connection string the backend uses. Raw manifests have no
  # templating, so you must embed the exact same REDIS_PASSWORD value set
  # above by hand — only the "redis" hostname/port/db typically change.
  REDIS_URL: "redis://:REPLACE_WITH_REDIS_PASSWORD@redis:6379/0"
